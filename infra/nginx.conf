# /etc/nginx/sites-available/wds
# ใส่ชื่อ domain ของคุณที่ server_name
# รัน: sudo certbot --nginx -d yourdomain.com -d www.yourdomain.com

server {
    listen 80;
    server_name yourdomain.com www.yourdomain.com;

    # Redirect HTTP → HTTPS (certbot จะเพิ่มให้อัตโนมัติ)
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name yourdomain.com www.yourdomain.com;

    # SSL — certbot จะเติมส่วนนี้ให้อัตโนมัติ
    # ssl_certificate     /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;

    # Next.js static files (เร็วกว่าผ่าน Node.js)
    root /home/deploy/wds;

    # /_next/static — cache ยาว
    location /_next/static/ {
        alias /home/deploy/wds/.next/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Static public folder
    location /public/ {
        alias /home/deploy/wds/public/;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    # Everything else → Next.js
    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";   # WebSocket / Realtime
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffer_size  128k;
        proxy_buffers      4 256k;
    }

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    client_max_body_size 20M;   # สำหรับ upload รูป/สลิป
}
